<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SkillBox AI — One base model. Many skills. Train locally. Use anywhere." />
    <title>SkillBox AI — Your AI. Your Skills. Your Device.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F855F'/%3E%3Crect x='14' y='14' width='24' height='24' rx='7' fill='%23ffffff' fill-opacity='.92'/%3E%3Crect x='30' y='30' width='20' height='20' rx='6' fill='%23ffffff' fill-opacity='.55'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Sora:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("skillbox.app") || "{}");
        var t = s && s.state && s.state.theme;
        var dark = t === "dark" || ((t === "system" || !t) && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
